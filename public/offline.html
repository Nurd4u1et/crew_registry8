<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1f3d" />
    <title>Offline · Crew Registry</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: #edf1f3; color: #13222d; font: 1rem/1.55 system-ui, sans-serif; }
      main { width: min(100%, 34rem); padding: clamp(1.25rem, 6vw, 2.5rem); border: 1px solid #c9d4da; border-radius: 8px; background: white; }
      h1 { margin: 0 0 .5rem; font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.15; }
      p { color: #4b5c68; }
      button { min-height: 44px; padding: .65rem 1rem; border: 0; border-radius: 6px; background: #1b4fd8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p>CREW REGISTRY</p>
      <h1 id="offline-title">You are offline</h1>
      <p id="offline-message" role="status">This page is saved on this device. Previously opened crew records remain available in the app. Reconnect and try again when you are ready.</p>
      <button id="retry-button" type="button">Retry connection</button>
    </main>
    <script>
      const title = document.getElementById("offline-title");
      const message = document.getElementById("offline-message");
      const retry = document.getElementById("retry-button");
      function updateConnection() {
        const online = navigator.onLine;
        title.textContent = online ? "You are back online" : "You are offline";
        message.textContent = online
          ? "Your connection is back. Return to the crew registry to continue."
          : "This page is saved on this device. Previously opened crew records remain available in the app. Reconnect and try again when you are ready.";
        retry.textContent = online ? "Return to app" : "Retry connection";
      }
      retry.addEventListener("click", () => {
        if (navigator.onLine) location.href = "/";
        else location.reload();
      });
      window.addEventListener("online", updateConnection);
      window.addEventListener("offline", updateConnection);
      updateConnection();
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="A ring-shaped space station orbiting a planet">
  <defs>
    <radialGradient id="planet" cx="30%" cy="25%" r="85%">
      <stop offset="0" stop-color="#3d63c9"/>
      <stop offset="0.6" stop-color="#1b2f6e"/>
      <stop offset="1" stop-color="#0b1633"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9efff"/>
      <stop offset="1" stop-color="#8aa6e6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="520" fill="#0f1f3d"/>
  <g fill="#fff">
    <circle cx="60" cy="70" r="1.6"/><circle cx="150" cy="30" r="1.1"/><circle cx="260" cy="95" r="1.4"/>
    <circle cx="410" cy="40" r="1.8"/><circle cx="520" cy="110" r="1.2"/><circle cx="590" cy="48" r="1.5"/>
    <circle cx="90" cy="180" r="1.2"/><circle cx="560" cy="210" r="1.6"/><circle cx="330" cy="150" r="1"/>
    <circle cx="35" cy="290" r="1.3"/><circle cx="610" cy="320" r="1.1"/><circle cx="200" cy="215" r="1"/>
  </g>
  <circle cx="320" cy="640" r="330" fill="url(#planet)"/>
  <circle cx="320" cy="640" r="330" fill="none" stroke="#6f93ee" stroke-opacity=".35" stroke-width="2"/>
  <g transform="translate(320 225) rotate(-18)">
    <ellipse rx="190" ry="64" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <ellipse rx="190" ry="64" fill="none" stroke="#0f1f3d" stroke-width="2" stroke-dasharray="3 18"/>
    <g stroke="#b9c9f2" stroke-width="5" stroke-linecap="round">
      <line x1="-190" y1="0" x2="-30" y2="0"/><line x1="190" y1="0" x2="30" y2="0"/>
      <line x1="0" y1="-64" x2="0" y2="-24"/><line x1="0" y1="64" x2="0" y2="24"/>
    </g>
    <circle r="30" fill="#e9efff"/>
    <circle r="12" fill="#1b4fd8"/>
    <g fill="#ffc857"><circle cx="-190" cy="0" r="5"/><circle cx="190" cy="0" r="5"/><circle cx="0" cy="-64" r="5"/></g>
  </g>
